[package]
name = "{{project-name}}"
description = "{{project-description}}"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
#tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
tracing-appender = "0.2.4"

#web
axum = { version = "0.8.8", features = ["multipart"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "trace", "cors", "sensitive-headers"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }

#serde
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-inline-default = "1.0.1"
toml = "0.9.12"

#database
migration = {path = "migration"}
sea-orm = { version = "1.1.19", features = ["macros", "sqlx-postgres", "runtime-tokio-rustls"] }

#tools
tokio = "1.50.0"
diff = "0.1.13"
futures = "0.3.32"
shadow-rs = "1.7.1"
thiserror = "2.0.18"


[build-dependencies]
shadow-rs = "1.7.1"
