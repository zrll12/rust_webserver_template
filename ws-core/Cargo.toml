[package]
name = "ws-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8" }
sea-orm = { version = "2.0.0-rc.40", features = [
    "macros",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "schema-sync",
    "entity-registry",
] }
serde = { version = "1.0", features = ["derive"] }
serde-inline-default = "1.0.1"
toml = "0.9"
dashmap = "6"
thiserror = "2.0"
tracing = "0.1"
futures = "0.3"
diff = "0.1"
